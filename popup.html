<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="popup.js" defer></script>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="container">
        <div id="stringAndRock">
            <img id="string" src="images/string.png">
            <img id="rock" src="images/rock.png">
        </div>
        <div id="vr"></div>
        <div id="weather">
            <img id="weatherIcon" src="images/weather.png">
            <div id="tempWrapper">
                <div id="temp">11°C</div>
                <p id="tempwords">Overcast Clouds</p>
                <div id="feelslike">Feels like 10°</div>
                <div id="highlow">H: 11 L: 8</div>
            </div>
            <div id="humidityWrapper">
                <div id="humidityTitle">
                    <img id="humidityIcon" src="images/humidity.png">
                    Humidity
                </div>
                <div id="humidity">82%</div>
            </div>
            <div id="windWrapper">
                <div id="windTitle">
                    <img id="windIcon" src="images/wind.png">
                    Wind
                </div>
                <div id="wind">1 m/s ENE</div>
            </div>
            <div id="visibilityWrapper">
                <div id="visibilityTitle">
                    <img id="visibilityIcon" src="images/visibility.png">
                    Visibility
                </div>
                <div id="visibility">20%</div>
            </div>
            <div id="UVindexWrapper">
                <div id="UVindexTitle">
                    <img id="UVindexIcon" src="images/UVindex.png">
                    UV Index
                </div>
                <div id="UVindex">0</div>
            </div>
        </div>
    </div>
</body>
</html>
