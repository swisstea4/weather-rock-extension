<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="popup.js" defer></script>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="loading">Loading...</div>
    <div id="container">
        <div id="rockCard">
            <div id="stringAndRock">
                <img id="string" src="images/string.png">
                <img id="rock" src="images/rock.png">
                <img id="watersplash" src="images/watersplash.png">
                <img id="scarf" src="images/scarf.png">
                <img id="sweat" src="images/sweat.png">
            </div>
            <img id="shadow" src="images/shadow.png">
        </div>
        <div id="vr"></div>
        <div id="weather">
            <img id="weatherIcon" src="images/weather.png">
            <div id="tempWrapper">
                <div id="temp"></div>
                <p id="tempdesc"></p>
                <div id="feelslike"></div>
                <div id="highlow"></div>
            </div>
            <div id="humidityWrapper">
                <div id="humidityTitle">
                    <img id="humidityIcon" src="images/humidity.png">
                    Humidity
                </div>
                <div id="humidity"></div>
            </div>
            <div id="windWrapper">
                <div id="windTitle">
                    <img id="windIcon" src="images/wind.png">
                    Wind
                </div>
                <div id="wind"></div>
            </div>
            <div id="visibilityWrapper">
                <div id="visibilityTitle">
                    <img id="visibilityIcon" src="images/visibility.png">
                    Visibility
                </div>
                <div id="visibility"></div>
            </div>
            <div id="pressureWrapper">
                <div id="pressureTitle">
                    <img id="pressureIcon" src="images/pressure.png">
                    Pressure
                </div>
                <div id="pressure"></div>
            </div>
        </div>
    </div>
</body>
</html>
