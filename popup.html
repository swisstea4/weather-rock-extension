<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="popup.js" defer></script>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="container">
        <div id="stringAndRock">
            <img id="string" src="images/string.png">
            <img id="rock" src="images/rock.png">
        </div>
        <div id="vr"></div>
        <div id="weather">
            <div id="tempWrapper">
                <div id="temp">11°C</div>
                <p id="tempwords">Overcast Clouds</p>
                <div id="feelslike">Feels like 10°</div>
                <div id="highlow">H: 11 L: 8</div>
            </div>
            <div id="humidityWrapper">
                Humidity
                <div id="humidity">82%</div>
            </div>
            <div id="windWrapper">
                Wind
                <div id="wind">1 m/s ENE</div>
            </div>
            <div id="rainChanceWrapper">
                Rain Chance
                <div id="rainChance">20%</div>
            </div>
            <div id="UVindexWrapper">
                UV Index
                <div id="UVindex">0</div>
            </div>
        </div>
    </div>
</body>
</html>
